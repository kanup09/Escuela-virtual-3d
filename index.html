<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Escuela Virtual</title>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <!-- Tour con imágenes (pantalla de inicio) -->
    <div id="tour"></div>

    <!-- Recorrido libre en 3D (se carga solo si lo piden) -->
    <div id="app" hidden>
      <header>
        <div>
          <strong>ESCUELA <span>3D</span></strong>
          <small>RECORRIDO LIBRE</small>
        </div>
        <button id="back-tour">← Volver al tour</button>
        <div id="status">Cargando…</div>
      </header>

      <main id="viewer"></main>

      <footer>
        <div class="actions">
          <button id="orbit" class="active">↻ Vista órbita</button>
          <button id="walk">♙ Caminar</button>
          <button id="reset">⌂ Reiniciar vista</button>
          <button id="pick">📍 Fijar inicio</button>
        </div>
        <p id="hint">Arrastrá para girar · Rueda para zoom</p>
      </footer>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
